<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Cup / Match Board Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Prompt", sans-serif;
      }

      /* เอฟเฟกต์แสงพื้นหลังและกรอบ */
      .container-glow {
        box-shadow: 0 0 35px rgba(0, 0, 0, 0.9),
          0 0 15px rgba(212, 175, 55, 0.1);
      }
      .header-card {
        background: linear-gradient(
          135deg,
          #131318 0%,
          #1a1b22 50%,
          #131318 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      /* ซ่อน Scrollbar แต่ยังลากเลื่อนได้ */
      .hide-scroll::-webkit-scrollbar {
        display: none;
      }
      .hide-scroll {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .cursor-grab {
        cursor: grab;
      }
      .cursor-grabbing {
        cursor: grabbing !important;
      }

      /* การ์ดแมตช์สไตล์ Cyber-Sport */
      .match-card {
        background: linear-gradient(
          145deg,
          rgba(24, 24, 30, 0.95) 0%,
          rgba(14, 14, 18, 0.98) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        position: relative;
        overflow: hidden;
      }

      /* เส้นแสงขอบบนของการ์ด */
      .match-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 15%;
        width: 70%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(212, 175, 55, 0.6),
          transparent
        );
        transition: all 0.3s ease;
      }

      .match-card:hover {
        transform: translateY(-4px);
        border-color: rgba(212, 175, 55, 0.4);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8),
          0 0 20px rgba(212, 175, 55, 0.15);
      }
      .match-card:hover::before {
        width: 100%;
        left: 0;
        background: linear-gradient(90deg, transparent, #f1c40f, transparent);
      }

      /* กรอบรูปโลโก้ทีม */
      .team-logo-box {
        background: radial-gradient(
          circle,
          rgba(40, 40, 50, 0.8) 0%,
          rgba(18, 18, 22, 0.9) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6),
          0 4px 8px rgba(0, 0, 0, 0.3);
      }

      /* ป้าย VS */
      .vs-badge {
        background: linear-gradient(135deg, #2b2b36 0%, #15151b 100%);
        border: 1px solid rgba(212, 175, 55, 0.4);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5),
          inset 0 1px 1px rgba(255, 255, 255, 0.1);
      }

      /* ปุ่มกดด้านล่าง */
      .btn-action {
        background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
        color: #000;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
      }
      .btn-action:hover {
        background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 100%);
        transform: scale(1.02);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      }
    </style>
  </head>
  <body class="bg-transparent m-0 p-0">
    <div
      id="wc-mount"
      class="w-full bg-[#09090c] text-white p-4 rounded-3xl border border-zinc-800/80 container-glow relative overflow-hidden font-sans flex flex-col justify-center select-none"
    >
      <div class="flex justify-center items-center py-12">
        <div
          class="flex items-center gap-3 text-zinc-500 animate-pulse text-sm font-semibold"
        >
          <i class="fas fa-circle-notch fa-spin text-[#D4AF37]"></i>
          กำลังอัปเดตข้อมูลการแข่งขัน...
        </div>
      </div>
    </div>

    <script>
      // 🔑 เปลี่ยน API URL และ API KEY เป็นของโปรเจกต์คุณเรียบร้อยแล้วครับ
      const DB_URL =
        "https://mpakuymtnfvbaukhhdch.supabase.co/rest/v1/tbl_worldcup_board";
      const API_KEY = "sb_publishable_mEO4n-ep4h5aP6FYZKC3yA_7KikwCCa";
      let timerInterval = null;

      async function initWorldCup() {
        const mount = document.getElementById("wc-mount");
        try {
          const res = await fetch(DB_URL, {
            headers: { apikey: API_KEY, Authorization: `Bearer ${API_KEY}` },
          });
          const data = await res.json();

          if (!data || data.length === 0) {
            mount.innerHTML =
              '<p class="text-center text-zinc-500 py-10 text-sm font-medium">ยังไม่มีรายการแข่งขันในระบบ</p>';
            return;
          }

          const d = data[data.length - 1];
          const list = d.matches_list || [];
          const rawIframeCode = d.iframe_code || "";

          // ถอดรหัสหา URL จริงจากฐานข้อมูล
          let targetUrl = "javascript:void(0);";
          if (rawIframeCode.trim() !== "") {
            const trimmed = rawIframeCode.trim();
            if (trimmed.startsWith("http")) {
              targetUrl = trimmed;
            } else {
              const match = trimmed.match(/src=["']([^"']+)["']/i);
              if (match && match[1]) {
                targetUrl = match[1];
              }
            }
          }

          // ส่วนหัว (Header Scoreboard Style)
          let html = `
            <!-- แสงพื้นหลังตกแต่ง -->
            <div class="absolute -top-20 -left-20 w-72 h-72 bg-yellow-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="header-card px-5 py-4 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 mb-4 relative z-10">
                <div class="flex items-center justify-between w-full md:w-auto">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                            <span class="text-[10px] font-extrabold tracking-widest text-zinc-400 uppercase">LIVE PROGRAM & ODDS</span>
                        </div>
                        <h1 class="text-xl md:text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-zinc-100 to-zinc-400 leading-tight">${
                          d.header_title || "ตารางการแข่งขัน"
                        }</h1>
                        <div class="flex items-center gap-2.5 mt-2">
                            <span class="bg-gradient-to-r from-amber-400 to-yellow-300 text-black px-2.5 py-0.5 rounded text-[11px] font-black shadow-sm">${
                              d.today_count || "วันนี้"
                            }</span> 
                            <span class="text-zinc-300 text-xs font-medium tracking-wide">${
                              d.upcoming_count || ""
                            }</span>
                        </div>
                    </div>
                </div>

                <!-- นับถอยหลังสไตล์ป้ายสนาม -->
                <div class="bg-[#0b0b0e] border border-zinc-800 px-4 py-2.5 rounded-xl flex items-center gap-3 w-full md:w-auto justify-center shadow-inner">
                    <div class="flex flex-col items-end shrink-0 border-r border-zinc-800 pr-3">
                        <span class="text-[9px] uppercase tracking-wider text-zinc-400 font-bold">นัดถัดไปในอีก</span>
                        <span class="text-[10px] text-amber-400 font-black tracking-widest">COUNTDOWN</span>
                    </div>
                    <div id="wc-timer" class="flex items-center gap-1 font-mono font-bold text-xs">
                        <span class="bg-zinc-900/90 border border-zinc-700/50 px-1.5 py-1 rounded text-amber-400 text-sm font-black shadow">0</span><span class="text-[9px] text-zinc-500">วัน</span>
                        <span class="bg-zinc-900/90 border border-zinc-700/50 px-1.5 py-1 rounded text-amber-400 text-sm font-black shadow">00</span><span class="text-[9px] text-zinc-500">ชม</span>
                        <span class="bg-zinc-900/90 border border-zinc-700/50 px-1.5 py-1 rounded text-amber-400 text-sm font-black shadow">00</span><span class="text-[9px] text-zinc-500">น</span>
                        <span class="bg-zinc-900/90 border border-zinc-700/50 px-1.5 py-1 rounded text-amber-400 text-sm font-black shadow">00</span><span class="text-[9px] text-zinc-500">วิ</span>
                    </div>
                </div>
            </div>
          `;

          if (list.length === 0) {
            html += `<p class="text-center text-zinc-500 py-8 text-xs font-medium">ไม่มีโปรแกรมการแข่งขันในขณะนี้</p>`;
          } else {
            html += `<div id="slider-container" class="flex flex-row overflow-x-auto gap-3.5 relative z-10 pb-2 snap-x snap-mandatory hide-scroll cursor-grab">`;

            list.forEach((m) => {
              const hRate = m.rate || 50;
              const aRate = 100 - hRate;

              html += `
                <div class="match-card min-w-[260px] md:min-w-[285px] flex-none snap-start p-4 flex flex-col justify-between">
                    <div class="relative z-10">
                        <!-- ส่วนหัวการ์ด (วันที่ & ลีก) -->
                        <div class="flex justify-between items-center mb-3.5 pb-2 border-b border-zinc-800/60">
                            <span class="text-[11px] font-bold text-zinc-400 font-mono flex items-center gap-1">
                                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 inline-block"></span> ${
                                  m.date || ""
                                }
                            </span>
                            <span class="bg-gradient-to-r from-amber-400/20 to-yellow-400/10 text-amber-300 border border-amber-400/30 text-[9px] font-extrabold px-2 py-0.5 rounded tracking-wider uppercase">${
                              m.badge || "LIVE"
                            }</span>
                        </div>

                        <!-- พื้นที่ประชันหน้า (ทีมเหย้า VS ทีมเยือน) -->
                        <div class="grid grid-cols-3 items-center my-2 pointer-events-none gap-1">
                            <!-- ทีมเหย้า -->
                            <div class="flex flex-col items-center text-center gap-2">
                                <div class="w-14 h-14 rounded-2xl team-logo-box flex items-center justify-center p-2 transition-transform duration-300 group-hover:scale-105">
                                    <img src="${
                                      m.h_flag
                                    }" alt="" class="max-w-full max-h-full object-contain filter drop-shadow-[0_2px_5px_rgba(0,0,0,0.8)]" onerror="this.src='https://flagcdn.com/w40/un.png'">
                                </div>
                                <span class="font-extrabold text-xs text-zinc-100 line-clamp-2 tracking-wide h-8 flex items-center justify-center leading-tight">${
                                  m.h_name || "Home"
                                }</span>
                            </div>

                            <!-- ป้าย VS -->
                            <div class="flex flex-col items-center justify-center">
                                <div class="vs-badge text-[10px] font-black text-amber-400 px-2.5 py-1 rounded-lg tracking-widest italic transform -skew-x-6">
                                    VS
                                </div>
                            </div>

                            <!-- ทีมเยือน -->
                            <div class="flex flex-col items-center text-center gap-2">
                                <div class="w-14 h-14 rounded-2xl team-logo-box flex items-center justify-center p-2 transition-transform duration-300 group-hover:scale-105">
                                    <img src="${
                                      m.a_flag
                                    }" alt="" class="max-w-full max-h-full object-contain filter drop-shadow-[0_2px_5px_rgba(0,0,0,0.8)]" onerror="this.src='https://flagcdn.com/w40/un.png'">
                                </div>
                                <span class="font-extrabold text-xs text-zinc-100 line-clamp-2 tracking-wide h-8 flex items-center justify-center leading-tight">${
                                  m.a_name || "Away"
                                }</span>
                            </div>
                        </div>
                    </div>

                    <div class="relative z-10 mt-3 pt-3 border-t border-zinc-800/80">
                        <!-- แถบสถิติเซียนเลือก -->
                        <div class="mb-3 pointer-events-none">
                            <div class="flex justify-between text-[10px] mb-1 font-bold">
                                <span class="text-zinc-300 flex items-center gap-1">
                                    เซียนเลือก <strong class="text-amber-400 font-mono text-xs">${hRate}%</strong>
                                </span>
                                <span class="text-zinc-400 font-mono text-xs">${aRate}%</span>
                            </div>
                            <div class="w-full bg-zinc-900/90 h-2 rounded-full overflow-hidden flex p-0.5 border border-zinc-800">
                                <div class="bg-gradient-to-r from-amber-500 to-yellow-300 h-full rounded-l-full" style="width: ${hRate}%"></div>
                                <div class="bg-zinc-700 h-full rounded-r-full" style="width: ${aRate}%"></div>
                            </div>
                        </div>

                        <!-- เวลา & ลิงก์วิเคราะห์ -->
                        <div class="flex justify-between items-center pt-1">
                            <span class="bg-black/60 border border-zinc-800 text-zinc-300 font-mono font-bold text-[11px] px-2.5 py-1 rounded-lg flex items-center gap-1.5">
                                <i class="far fa-clock text-amber-400"></i> ${
                                  m.time || ""
                                }
                            </span>
                            <a href="${
                              m.url || "#"
                            }" target="_blank" class="text-[11px] font-extrabold text-amber-400 hover:text-white bg-amber-400/10 hover:bg-amber-400/20 border border-amber-400/30 px-3 py-1 rounded-lg transition-all duration-200 flex items-center gap-1 group">
                                วิเคราะห์ <span class="transform group-hover:translate-x-0.5 transition-transform">↗</span>
                            </a>
                        </div>
                    </div>
                </div>
              `;
            });

            html += `</div>`;
          }

          // ส่วนท้าย (Footer)
          html += `
            <footer class="mt-3 pt-3 border-t border-zinc-800/60 flex justify-center md:justify-start relative z-10">
                <a 
                  href="${targetUrl}" 
                  ${
                    targetUrl !== "javascript:void(0);"
                      ? 'target="_blank"'
                      : "onclick=\"alert('ขออภัย! ขณะนี้ยังไม่ได้ตั้งค่าลิงก์โปรแกรมการแข่งขันในระบบ')\""
                  } 
                  class="btn-action font-extrabold px-6 py-2.5 rounded-xl flex items-center gap-2 text-xs cursor-pointer tracking-wide"
                >
                    <span>ดูโปรแกรมการแข่งขันทั้งหมด</span>
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                        <path d="M5 13h11.17l-4.88 4.88c-.39.39-.39 1.03 0 1.42.39.39 1.02.39 1.41 0l6.59-6.59c.39-.39.39-1.02 0-1.41l-6.58-6.6a.9959.9959 0 0 0-1.41 0c-.39.39-.39 1.02 0 1.41L16.17 11H5c-.55 0-1 .45-1 1s.45 1 1 1z"/>
                    </svg>
                </a>
            </footer>
          `;

          mount.innerHTML = html;

          if (list.length > 0) enableDragScroll();
          if (d.countdown_target) runTimer(d.countdown_target);
        } catch (e) {
          mount.innerHTML = `<p class="text-red-400 text-center py-6 text-xs font-semibold">เกิดข้อผิดพลาดในการดึงข้อมูลการแข่งขัน</p>`;
        }
      }

      function enableDragScroll() {
        const slider = document.getElementById("slider-container");
        let isDown = false,
          startX,
          scrollLeft;
        slider.addEventListener("mousedown", (e) => {
          isDown = true;
          slider.classList.add("cursor-grabbing");
          slider.style.scrollSnapType = "none";
          startX = e.pageX - slider.offsetLeft;
          scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener("mouseleave", () => {
          isDown = false;
          slider.classList.remove("cursor-grabbing");
          slider.style.scrollSnapType = "x mandatory";
        });
        slider.addEventListener("mouseup", () => {
          isDown = false;
          slider.classList.remove("cursor-grabbing");
          slider.style.scrollSnapType = "x mandatory";
        });
        slider.addEventListener("mousemove", (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - slider.offsetLeft;
          slider.scrollLeft = scrollLeft - (x - startX) * 1.5;
        });
      }

      function runTimer(targetStr) {
        if (timerInterval) clearInterval(timerInterval);
        const target = new Date(targetStr.replace(/-/g, "/")).getTime();
        if (isNaN(target)) return;

        const update = () => {
          const diff = target - new Date().getTime();
          const el = document.getElementById("wc-timer");
          if (!el) return;
          if (diff <= 0) {
            el.innerHTML = `<span class="text-red-500 font-extrabold text-xs tracking-wide animate-pulse">ถึงเวลาทำการแข่งขันแล้ว!</span>`;
            return clearInterval(timerInterval);
          }
          const d = Math.floor(diff / (1000 * 60 * 60 * 24));
          const h = Math.floor(
            (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
          );
          const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const s = Math.floor((diff % (1000 * 60)) / 1000);
          const pad = (n) => (n < 10 ? "0" + n : n);

          el.innerHTML = `
            <span class="bg-zinc-900/90 border border-zinc-700/50 px-1.5 py-0.5 rounded text-amber-400 text-xs font-black shadow">${d}</span><span class="text-[9px] text-zinc-400 ml-0.5 mr-1">วัน</span>
            <span class="bg-zinc-900/90 border border-zinc-700/50 px-1.5 py-0.5 rounded text-amber-400 text-xs font-black shadow">${pad(
              h
            )}</span><span class="text-[9px] text-zinc-400 ml-0.5 mr-1">ชม</span>
            <span class="bg-zinc-900/90 border border-zinc-700/50 px-1.5 py-0.5 rounded text-amber-400 text-xs font-black shadow">${pad(
              m
            )}</span><span class="text-[9px] text-zinc-400 ml-0.5 mr-1">น</span>
            <span class="bg-zinc-900/90 border border-zinc-700/50 px-1.5 py-0.5 rounded text-red-400 text-xs font-black shadow animate-pulse">${pad(
              s
            )}</span><span class="text-[9px] text-zinc-400 ml-0.5">วิ</span>
          `;
        };
        update();
        timerInterval = setInterval(update, 1000);
      }

      window.onload = initWorldCup;
    </script>
  </body>
</html>
